version: "3.9"
services: 
    web: 
        build: .
        ports:
            - "8000:8000"
        volumes:
             - .:/app
    db:
        image: "postgres:11"
        environment:
            - "POSTGRES_HOST_AUTH_METHOD=trust"
        volumes:
            - postgres_data:/var/lib/postgresql/data/
volumes:
    postgres_data: