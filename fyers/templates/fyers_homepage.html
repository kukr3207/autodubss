<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>banknifty bot Fyers</title>

	<!-- Latest compiled and minified CSS -->
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
	<style>
		#snackbar {
			visibility: hidden; /* Hidden by default. Visible on click */
			min-width: 250px; /* Set a default minimum width */
			margin-left: -125px; /* Divide value of min-width by 2 */
			background-color: #333; /* Black background color */
			color: #fff; /* White text color */
			text-align: center; /* Centered text */
			border-radius: 2px; /* Rounded borders */
			padding: 16px; /* Padding */
			position: fixed; /* Sit on top of the screen */
			z-index: 1; /* Add a z-index if needed */
			left: 50%; /* Center the snackbar */
			bottom: 30px; /* 30px from the bottom */
			}

			/* Show the snackbar when clicking on a button (class added with JavaScript) */
			#snackbar.show {
			visibility: visible; /* Show the snackbar */
			/* Add animation: Take 0.5 seconds to fade in and out the snackbar.
			However, delay the fade out process for 2.5 seconds */
			-webkit-animation: fadein 0.5s, fadeout 0.5s 2.5s;
			animation: fadein 0.5s, fadeout 0.5s 2.5s;
			}

			/* Animations to fade the snackbar in and out */
			@-webkit-keyframes fadein {
			from {bottom: 0; opacity: 0;}
			to {bottom: 30px; opacity: 1;}
			}

			@keyframes fadein {
			from {bottom: 0; opacity: 0;}
			to {bottom: 30px; opacity: 1;}
			}

			@-webkit-keyframes fadeout {
			from {bottom: 30px; opacity: 1;}
			to {bottom: 0; opacity: 0;}
			}

			@keyframes fadeout {
			from {bottom: 30px; opacity: 1;}
			to {bottom: 0; opacity: 0;}
			}
	</style>

</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-light bg-light">
  		<a class="navbar-brand" href="#">BankNifty Trading Bot</a>
  	</nav>
  	<br><br>
	<div class="container align-items-center mb-5 p-5">
		<div class="row"> 
			<div class="col-4">
				<h6 id="banknifty_introText">Execute a Bank Nifty Bot</h6>
				<div class="container">
					<button type="button" class="btn btn-primary" onclick="OpenBankniftyFormOnButtonClick()" id="bankniftybot_formbutton"> BankNifty Bot </button>
				</div>
				<form id="bankniftybot_form" method="POST" style="display:none" class="form-group" action="{% url 'bankniftybot_fyers' %}">
					{% csrf_token %}
					{{banknifty_form.as_p}}
					<input class="btn btn-danger" type="submit" name="" value="Submit" onclick="displayToast()"/>
				</form>
			</div>
			<div class="col-2"></div>
			<div class="col-4">
				<h6 id="crudeoil_introText">Execute a Crude Oil Bot</h6>
				<div class="container">
					<button type="button" class="btn btn-primary" onclick="OpenCrudeoilFormOnButtonClick()" id="crudeoilbot_formbutton" > CrudeOil Bot </button>
				</div>
				<form id="crudeoilbot_form" method="POST" style="display:none" class="form-group" action="{% url 'crudeoilbot_fyers' %}">
					{% csrf_token %}
					{{crudeoil_form.as_p}}
					<input class="btn btn-danger" type="submit" name="" value="Submit" onclick="displayToast()"/>
				</form>
			</div>
		</div>
	</div>
	<div id="snackbar" style="display: none;">
		Your order is taken successfully.<br>
		Do not re submit the form.
	</div>

	<script type="text/javascript">
		function OpenBankniftyFormOnButtonClick()
			{
			document.getElementById('bankniftybot_form').style.display = '';
			document.getElementById("bankniftybot_formbutton").style.display = 'none'
			document.getElementById("banknifty_introText").innerHTML = "Please Enter Number of Lots you want to trade Bank Nifty";
			}
			var myform = document.getElementById('toggleAfterClick');
			myform.onsubmit = function(){
			    document.getElementById("banknifty_introText").innerHTML = "Please Enter Number of Lots you want to trade Bank Nifty";
			    console.log("harsha");
			};
	</script>
	<script type="text/javascript">
		function OpenCrudeoilFormOnButtonClick()
			{
			document.getElementById('crudeoilbot_form').style.display = '';
			document.getElementById("crudeoilbot_formbutton").style.display = 'none'
			document.getElementById("crudeoil_introText").innerHTML = "Please Enter Number of Lots you want to trade Crude Oil";
			console.log("harsha2");	
		}
			var myform = document.getElementById('toggleAfterClick');
			myform.onsubmit = function(){
			    document.getElementById("crudeoil_introText").innerHTML = "Execute again";
			    console.log("harsha");
			};
	</script>
	<script type="text/javascript">
		function displayToast() {
		// Get the snackbar DIV
		var x = document.getElementById("snackbar");
		x.className = "show";
		x.style.display = "inline";
		// Add the "show" class to DIV
		// After 3 seconds, remove the show class from DIV
		setTimeout(function(){ x.className = x.className.replace("show", ""); }, 5000);
		}
	</script>
